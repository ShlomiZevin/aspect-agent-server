  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"59b269c9-e3aa-49d1-9dde-84f09d5f3c3b\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"fd64ea47-034a-486a-9de4-2a5a5ed420c2\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"962996d9-bd43-4ddd-a753-7de2b729dd94\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n  <style>/* ════════════════════════════════════════════════════════════\n   Lybi.ai — Color tokens\n   The palette is derived from the logo gradient. Two leading\n   colors — warm pink + deep purple — represent the two sides of\n   the brand: human warmth and intelligent depth.\n   ════════════════════════════════════════════════════════════ */\n:root {\n  /* ── Brand: Pink ── */\n  --lybi-pink:        #E0198A;\n  --lybi-pink-light:  #F060B0;\n  --lybi-pink-dark:   #B81470;\n\n  /* ── Brand: Purple ── */\n  --lybi-purple:        #5B1E8A;\n  --lybi-purple-mid:    #8A2290;  /* gradient waypoint */\n  --lybi-purple-grad:   #9A2295;  /* center of the master gradient */\n  --lybi-purple-bright: #B07BE8;  /* on-dark accent (labels, dots) */\n  --lybi-purple-dark:   #3A1260;\n\n  /* ── Brand: Gold (sparingly — persona accents, highlights) ── */\n  --lybi-gold: #FFC34D;\n\n  /* ── Dark surfaces (Deep Night) ── */\n  --lybi-dark:   #0A0420;  /* primary dark-slide / app background  */\n  --lybi-dark-2: #14082E;  /* panels & containers on dark          */\n  --lybi-dark-3: #1E1040;  /* third layer                          */\n\n  /* ── Light surfaces ── */\n  --lybi-body-bg:    #FAFAFF;  /* default page background      */\n  --lybi-white:      #FFFFFF;\n  --lybi-ghost:      #FBF5FF;  /* ghost lavender — light surface / hero bubble */\n  --lybi-ghost-deep: #F2EAF9;\n\n  /* ── Text ──\n     Contrast-hardened: every level here clears WCAG AA on white/ghost.\n     text-3 is the LIGHTEST text the system permits — anything lighter is\n     off-limits, it disappears on real screens/projectors. There is no\n     \"faint grey\" token on purpose. */\n  --lybi-text-1: #1A0A38;  /* primary ink — headings & body you must read */\n  --lybi-text-2: #423655;  /* body on light — ~9:1, crisp (was a washed dusk grey) */\n  --lybi-text-3: #665A7D;  /* muted / captions — ~5.4:1, still legible (never lighter) */\n\n  /* ── Lines & borders ──\n     Even the \"subtle\" hairline is drawn strong enough to actually divide\n     two surfaces — a border nobody can see is not a border. */\n  --lybi-line:     #E0D6EF;\n  --lybi-line-mid: #C4B4DF;\n  /* Projector-safe separators — visible on low-contrast client screens.\n     Use these (not --lybi-line) to divide adjacent tiles/cards on slides. */\n  --lybi-line-strong: #B49ED6;  /* @kind color */\n  --lybi-hairline-dark: rgba(255,255,255,.28);  /* @kind color */\n\n  /* ── Gradients ──\n     The gradient is the single strongest expression of the brand.\n     Always between the authorized colors, pink→purple. */\n  --lybi-grad:      linear-gradient(135deg, #E0198A 0%, #9A2295 50%, #5B1E8A 100%); /* @kind color */\n  --lybi-grad-soft: linear-gradient(135deg, rgba(224,25,138,.12) 0%, rgba(91,30,138,.12) 100%); /* @kind color */\n  --lybi-grad-user: linear-gradient(135deg, #7C4DD6 0%, #5B1E8A 100%); /* @kind color */\n\n  /* ── On-dark glass tints (conversation UI) ── */\n  --lybi-glass-fill:   rgba(255,255,255,.06);\n  --lybi-glass-fill-2: rgba(255,255,255,.045);\n  --lybi-glass-line:   rgba(255,255,255,.10);\n\n  /* ── Semantic aliases ──────────────────────────────────────── */\n  --surface-page:    var(--lybi-body-bg);\n  --surface-card:    var(--lybi-white);\n  --surface-sunken:  var(--lybi-ghost);\n  --surface-dark:    var(--lybi-dark);\n  --surface-dark-2:  var(--lybi-dark-2);\n\n  --text-strong:  var(--lybi-text-1);\n  --text-body:    var(--lybi-text-2);\n  --text-muted:   var(--lybi-text-3);\n  --text-on-dark: #FFFFFF;\n\n  --accent:        var(--lybi-purple);\n  --accent-pink:   var(--lybi-pink);\n  --accent-gradient: var(--lybi-grad);\n\n  --border-subtle: var(--lybi-line);\n  --border-strong: var(--lybi-line-mid);\n  --border-card:   var(--lybi-line-strong);  /* projector-safe card/tile border */\n\n  /* status (utility only — not a brand expression) */\n  --good: #2E7D32;\n  --good-bg: #E8F5E9;\n  --bad: #C62828;\n  --bad-bg: #FFEBEE;\n}\n<\u002Fstyle>\n  <style>/* ════════════════════════════════════════════════════════════\n   Lybi.ai — Typography tokens\n   One typeface does all the work: Assistant (Hebrew + Latin),\n   weights 300–800. JetBrains Mono is reserved for eyebrows and\n   monospace labels only. No serif, no second sans.\n   ════════════════════════════════════════════════════════════ */\n:root {\n  /* ── Families ── */\n  --font-sans:    'Assistant', system-ui, 'Segoe UI', Arial, sans-serif;\n  --font-display: 'Assistant', system-ui, sans-serif;   /* headlines / display */\n  --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', monospace;\n\n  /* ── Weights ── */\n  --fw-light:   300; /* @kind font */\n  --fw-regular: 400; /* @kind font */\n  --fw-medium:  500; /* @kind font */\n  --fw-semi:    600; /* @kind font */\n  --fw-bold:    700; /* @kind font */\n  --fw-black:   800; /* @kind font */\n\n  /* ── Type scale (screen / UI) ──\n     For app & web surfaces. H1 display is typically gradient clip-text.\n     NOTE: these are UI sizes — do NOT use them on slides. Slides read from\n     a couch/projector at 1280→1920+ scale and need the --slide-* scale below. */\n  --fs-display: 48px;   /* H1 / Display      */\n  --fs-h2:      32px;   /* Section title     */\n  --fs-h3:      22px;   /* Sub heading       */\n  --fs-body-lg: 18px;   /* Body large        */\n  --fs-body:    16px;   /* Body — the app/web default. Never set page body below this. */\n  --fs-sm:      14px;   /* Small body        */\n  --fs-caption: 13px;   /* Caption / label   */\n  --fs-eyebrow: 11px;   /* Mono eyebrow      */\n  --fs-micro:   10px;   /* Micro label       */\n\n  /* ── Slide type scale (16:9 · 1280×720 canvas) ──────────────────\n     Sized to be legible fullscreen. The single most important rule:\n     slide BODY copy is never smaller than --slide-body-sm (20px).\n     One clear step between every level — never glue a 32px subtitle\n     straight onto 14px body. Keep hierarchy: title → subtitle → body. */\n  --slide-display:   88px;  /* @kind font */\n  --slide-title:     52px;  /* @kind font */\n  --slide-heading:   38px;  /* @kind font */\n  --slide-subtitle:  27px;  /* @kind font */\n  --slide-lead:      24px;  /* @kind font */\n  --slide-body:      22px;  /* @kind font */\n  --slide-body-sm:   20px;  /* @kind font */\n  --slide-eyebrow:   15px;  /* @kind font */\n  --slide-caption:   15px;  /* @kind font */\n\n  /* ── Line heights ── */\n  --lh-tight:  1.1;     /* @kind font */\n  --lh-snug:   1.3;     /* @kind font */\n  --lh-body:   1.7;     /* @kind font */\n\n  /* ── Letter spacing ── */\n  --ls-eyebrow:  3px;   /* @kind font */\n  --ls-eyebrow-dark: 4px; /* @kind font */\n  --ls-label:    1.5px; /* @kind font */\n  --ls-tight:    -0.01em; /* @kind font */\n}\n<\u002Fstyle>\n  <style>/* ════════════════════════════════════════════════════════════\n   Lybi.ai — Spacing & radius tokens\n   Generous whitespace is a deliberate brand value (\"Restraint\" —\n   large white areas are strength, not emptiness). Buttons are\n   always fully pill (100px). Cards are softly rounded.\n   ════════════════════════════════════════════════════════════ */\n:root {\n  /* ── Spacing scale ── */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n\n  /* ── Radius ── */\n  --radius-xs:   4px;    /* bubble pinned corner */\n  --radius-sm:   8px;\n  --radius-md:   12px;   /* small cards          */\n  --radius-lg:   14px;   /* cards                */\n  --radius-xl:   18px;   /* glass conversation container */\n  --radius-pill: 100px;  /* buttons, badges — ALWAYS */\n  --radius-full: 9999px;\n\n  /* ── Layout ── */\n  --container-max: 1200px; /* @kind spacing */\n  --slide-w: 1280px;     /* @kind spacing */\n  --slide-h: 720px;      /* @kind spacing */\n\n  /* ── Slide safe area (16:9 · 1280×720) ──────────────────────────\n     Content lives INSIDE these margins — never let text or cards\n     touch the slide edge. The pager, logo and footer sit in the\n     outer band; the body-zone fills the space that's left and\n     content is centered within it (no top/bottom-pinned voids). */\n  --slide-pad-x: 96px;   /* @kind spacing */\n  --slide-pad-y: 72px;   /* @kind spacing */\n  --slide-gap:   28px;   /* @kind spacing */\n  --slide-stack: 16px;   /* @kind spacing */\n}\n<\u002Fstyle>\n  <style>/* ════════════════════════════════════════════════════════════\n   Lybi.ai — Effects: shadows, blur, motion\n   On light: soft purple-tinted shadows. On dark: glass surfaces\n   built from white-alpha fills + inset highlight + backdrop blur.\n   Motion is restrained — short fades and gentle lifts, never bounce.\n   ════════════════════════════════════════════════════════════ */\n:root {\n  /* ── Shadows (light surfaces) ── */\n  --shadow-sm:  0 1px 2px rgba(26,10,56,.06);\n  --shadow-md:  0 6px 18px rgba(26,10,56,.08);\n  --shadow-lg:  0 18px 48px rgba(26,10,56,.12);\n  --shadow-cta: 0 8px 24px rgba(224,25,138,.28);   /* gradient buttons / hero */\n  /* Projector-safe card lift — pairs WITH a --border-card, never instead of one.\n     On bad screens a shadow alone vanishes, so separation must come from the\n     border; this shadow only adds depth. */\n  --shadow-card: 0 10px 28px rgba(26,10,56,.14);\n\n  /* ── Glass (dark surfaces) ── */\n  --glass-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 10px 36px rgba(0,0,0,.30);\n  --glass-blur:   blur(22px); /* @kind other */\n  --hero-glow:    0 12px 30px rgba(224,25,138,.28), 0 0 0 2px rgba(240,96,176,.50);\n\n  /* ── Motion ──\n     Restrained, confident. Fades and small lifts; no springy bounce. */\n  --ease-standard: cubic-bezier(.2,.6,.2,1); /* @kind other */\n  --ease-out:      cubic-bezier(.16,1,.3,1); /* @kind other */\n  --dur-fast:   .15s; /* @kind other */\n  --dur-base:   .2s; /* @kind other */\n  --dur-slow:   .4s; /* @kind other */\n\n  /* hover/press conventions:\n     - hover: lift (translateY -1px) + slightly stronger shadow, OR brightness 1.05\n     - press: scale .98, shadow collapses\n     - gradient buttons darken via brightness(.95) on press */\n}\n\n/* Brand keyframes — typing indicator dots in the conversation UI */\n@keyframes lybi-blink {\n  0%, 100% { opacity: .25; transform: translateY(0); }\n  50%      { opacity: 1;   transform: translateY(-3px); }\n}\n<\u002Fstyle>\n  <style>/* ════════════════════════════════════════════════════════════\n   Lybi.ai Design System — global entry point.\n   Consumers link THIS file. It is a manifest of @imports only.\n   ════════════════════════════════════════════════════════════ */\n/* ── Lybi.ai webfonts ──\n   Assistant — all text (Hebrew + Latin), the single brand typeface.\n   JetBrains Mono — eyebrows, monospace labels (LYBI / CUSTOMER, section numbers).\n   Both are open-source Google Fonts; loaded via Google's CDN @font-face. */\n/* hebrew */\n@font-face {\n  font-family: 'Assistant';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"39109a53-3be4-4f48-ac7c-a225fb4f3329\") format('woff2');\n  unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Assistant';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"52999d71-0dfc-415f-a607-64a237544283\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Assistant';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"e61a8ccf-8b20-498e-a271-35f6cabc5f47\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* hebrew */\n@font-face {\n  font-family: 'Assistant';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"39109a53-3be4-4f48-ac7c-a225fb4f3329\") format('woff2');\n  unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Assistant';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"52999d71-0dfc-415f-a607-64a237544283\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Assistant';\n  font-style: norm 0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"fd64ea47-034a-486a-9de4-2a5a5ed420c2\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"962996d9-bd43-4ddd-a753-7de2b729dd94\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ════════════════════════════════════════════════════════════\n   Lybi.ai — Color tokens\n   The palette is derived from the logo gradient. Two leading\n   colors — warm pink + deep purple — represent the two sides of\n   the brand: human warmth and intelligent depth.\n   ════════════════════════════════════════════════════════════ */\n:root {\n  /* ── Brand: Pink ── */\n  --lybi-pink:        #E0198A;\n  --lybi-pink-light:  #F060B0;\n  --lybi-pink-dark:   #B81470;\n\n  /* ── Brand: Purple ── */\n  --lybi-purple:        #5B1E8A;\n  --lybi-purple-mid:    #8A2290;  /* gradient waypoint */\n  --lybi-purple-grad:   #9A2295;  /* center of the master gradient */\n  --lybi-purple-bright: #B07BE8;  /* on-dark accent (labels, dots) */\n  --lybi-purple-dark:   #3A1260;\n\n  /* ── Brand: Gold (sparingly — persona accents, highlights) ── */\n  --lybi-gold: #FFC34D;\n\n  /* ── Dark surfaces (Deep Night) ── */\n  --lybi-dark:   #0A0420;  /* primary dark-slide / app background  */\n  --lybi-dark-2: #14082E;  /* panels & containers on dark          */\n  --lybi-dark-3: #1E1040;  /* third layer                          */\n\n  /* ── Light surfaces ── */\n  --lybi-body-bg:    #FAFAFF;  /* default page background      */\n  --lybi-white:      #FFFFFF;\n  --lybi-ghost:      #FBF5FF;  /* ghost lavender — light surface / hero bubble */\n  --lybi-ghost-deep: #F2EAF9;\n\n  /* ── Text ──\n     Contrast-hardened: every level here clears WCAG AA on white/ghost.\n     text-3 is the LIGHTEST text the system permits — anything lighter is\n     off-limits, it disappears on real screens/projectors. There is no\n     \"faint grey\" token on purpose. */\n  --lybi-text-1: #1A0A38;  /* primary ink — headings & body you must read */\n  --lybi-text-2: #423655;  /* body on light — ~9:1, crisp (was a washed dusk grey) */\n  --lybi-text-3: #665A7D;  /* muted / captions — ~5.4:1, still legible (never lighter) */\n\n  /* ── Lines & borders ──\n     Even the \"subtle\" hairline is drawn strong enough to actually divide\n     two surfaces — a border nobody can see is not a border. */\n  --lybi-line:     #E0D6EF;\n  --lybi-line-mid: #C4B4DF;\n  /* Projector-safe separators — visible on low-contrast client screens.\n     Use these (not --lybi-line) to divide adjacent tiles/cards on slides. */\n  --lybi-line-strong: #B49ED6;  /* @kind color */\n  --lybi-hairline-dark: rgba(255,255,255,.28);  /* @kind color */\n\n  /* ── Gradients ──\n     The gradient is the single strongest expression of the brand.\n     Always between the authorized colors, pink→purple. */\n  --lybi-grad:      linear-gradient(135deg, #E0198A 0%, #9A2295 50%, #5B1E8A 100%); /* @kind color */\n  --lybi-grad-soft: linear-gradient(135deg, rgba(224,25,138,.12) 0%, rgba(91,30,138,.12) 100%); /* @kind color */\n  --lybi-grad-user: linear-gradient(135deg, #7C4DD6 0%, #5B1E8A 100%); /* @kind color */\n\n  /* ── On-dark glass tints (conversation UI) ── */\n  --lybi-glass-fill:   rgba(255,255,255,.06);\n  --lybi-glass-fill-2: rgba(255,255,255,.045);\n  --lybi-glass-line:   rgba(255,255,255,.10);\n\n  /* ── Semantic aliases ──────────────────────────────────────── */\n  --surface-page:    var(--lybi-body-bg);\n  --surface-card:    var(--lybi-white);\n  --surface-sunken:  var(--lybi-ghost);\n  --surface-dark:    var(--lybi-dark);\n  --surface-dark-2:  var(--lybi-dark-2);\n\n  --text-strong:  var(--lybi-text-1);\n  --text-body:    var(--lybi-text-2);\n  --text-muted:   var(--lybi-text-3);\n  --text-on-dark: #FFFFFF;\n\n  --accent:        var(--lybi-purple);\n  --accent-pink:   var(--lybi-pink);\n  --accent-gradient: var(--lybi-grad);\n\n  --border-subtle: var(--lybi-line);\n  --border-strong: var(--lybi-line-mid);\n  --border-card:   var(--lybi-line-strong);  /* projector-safe card/tile border */\n\n  /* status (utility only — not a brand expression) */\n  --good: #2E7D32;\n  --good-bg: #E8F5E9;\n  --bad: #C62828;\n  --bad-bg: #FFEBEE;\n}\n\n/* ════════════════════════════════════════════════════════════\n   Lybi.ai — Typography tokens\n   One typeface does all the work: Assistant (Hebrew + Latin),\n   weights 300–800. JetBrains Mono is reserved for eyebrows and\n   monospace labels only. No serif, no second sans.\n   ════════════════════════════════════════════════════════════ */\n:root {\n  /* ── Families ── */\n  --font-sans:    'Assistant', system-ui, 'Segoe UI', Arial, sans-serif;\n  --font-display: 'Assistant', system-ui, sans-serif;   /* headlines / display */\n  --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', monospace;\n\n  /* ── Weights ── */\n  --fw-light:   300; /* @kind font */\n  --fw-regular: 400; /* @kind font */\n  --fw-medium:  500; /* @kind font */\n  --fw-semi:    600; /* @kind font */\n  --fw-bold:    700; /* @kind font */\n  --fw-black:   800; /* @kind font */\n\n  /* ── Type scale (screen / UI) ──\n     For app & web surfaces. H1 display is typically gradient clip-text.\n     NOTE: these are UI sizes — do NOT use them on slides. Slides read from\n     a couch/projector at 1280→1920+ scale and need the --slide-* scale below. */\n  --fs-display: 48px;   /* H1 / Display      */\n  --fs-h2:      32px;   /* Section title     */\n  --fs-h3:      22px;   /* Sub heading       */\n  --fs-body-lg: 18px;   /* Body large        */\n  --fs-body:    16px;   /* Body — the app/web default. Never set page body below this. */\n  --fs-sm:      14px;   /* Small body        */\n  --fs-caption: 13px;   /* Caption / label   */\n  --fs-eyebrow: 11px;   /* Mono eyebrow      */\n  --fs-micro:   10px;   /* Micro label       */\n\n  /* ── Slide type scale (16:9 · 1280×720 canvas) ──────────────────\n     Sized to be legible fullscreen. The single most important rule:\n     slide BODY copy is never smaller than --slide-body-sm (20px).\n     One clear step between every level — never glue a 32px subtitle\n     straight onto 14px body. Keep hierarchy: title → subtitle → body. */\n  --slide-display:   88px;  /* @kind font */\n  --slide-title:     52px;  /* @kind font */\n  --slide-heading:   38px;  /* @kind font */\n  --slide-subtitle:  27px;  /* @kind font */\n  --slide-lead:      24px;  /* @kind font */\n  --slide-body:      22px;  /* @kind font */\n  --slide-body-sm:   20px;  /* @kind font */\n  --slide-eyebrow:   15px;  /* @kind font */\n  --slide-caption:   15px;  /* @kind font */\n\n  /* ── Line heights ── */\n  --lh-tight:  1.1;     /* @kind font */\n  --lh-snug:   1.3;     /* @kind font */\n  --lh-body:   1.7;     /* @kind font */\n\n  /* ── Letter spacing ── */\n  --ls-eyebrow:  3px;   /* @kind font */\n  --ls-eyebrow-dark: 4px; /* @kind font */\n  --ls-label:    1.5px; /* @kind font */\n  --ls-tight:    -0.01em; /* @kind font */\n}\n\n/* ════════════════════════════════════════════════════════════\n   Lybi.ai — Spacing & radius tokens\n   Generous whitespace is a deliberate brand value (\"Restraint\" —\n   large white areas are strength, not emptiness). Buttons are\n   always fully pill (100px). Cards are softly rounded.\n   ════════════════════════════════════════════════════════════ */\n:root {\n  /* ── Spacing scale ── */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n\n  /* ── Radius ── */\n  --radius-xs:   4px;    /* bubble pinned corner */\n  --radius-sm:   8px;\n  --radius-md:   12px;   /* small cards          */\n  --radius-lg:   14px;   /* cards                */\n  --radius-xl:   18px;   /* glass conversation container */\n  --radius-pill: 100px;  /* buttons, badges — ALWAYS */\n  --radius-full: 9999px;\n\n  /* ── Layout ── */\n  --container-max: 1200px; /* @kind spacing */\n  --slide-w: 1280px;     /* @kind spacing */\n  --slide-h: 720px;      /* @kind spacing */\n\n  /* ── Slide safe area (16:9 · 1280×720) ──────────────────────────\n     Content lives INSIDE these margins — never let text or cards\n     touch the slide edge. The pager, logo and footer sit in the\n     outer band; the body-zone fills the space that's left and\n     content is centered within it (no top/bottom-pinned voids). */\n  --slide-pad-x: 96px;   /* @kind spacing */\n  --slide-pad-y: 72px;   /* @kind spacing */\n  --slide-gap:   28px;   /* @kind spacing */\n  --slide-stack: 16px;   /* @kind spacing */\n}\n\n/* ════════════════════════════════════════════════════════════\n   Lybi.ai — Effects: shadows, blur, motion\n   On light: soft purple-tinted shadows. On dark: glass surfaces\n   built from white-alpha fills + inset highlight + backdrop blur.\n   Motion is restrained — short fades and gentle lifts, never bounce.\n   ════════════════════════════════════════════════════════════ */\n:root {\n  /* ── Shadows (light surfaces) ── */\n  --shadow-sm:  0 1px 2px rgba(26,10,56,.06);\n  --shadow-md:  0 6px 18px rgba(26,10,56,.08);\n  --shadow-lg:  0 18px 48px rgba(26,10,56,.12);\n  --shadow-cta: 0 8px 24px rgba(224,25,138,.28);   /* gradient buttons / hero */\n  /* Projector-safe card lift — pairs WITH a --border-card, never instead of one.\n     On bad screens a shadow alone vanishes, so separation must come from the\n     border; this shadow only adds depth. */\n  --shadow-card: 0 10px 28px rgba(26,10,56,.14);\n\n  /* ── Glass (dark surfaces) ── */\n  --glass-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 10px 36px rgba(0,0,0,.30);\n  --glass-blur:   blur(22px); /* @kind other */\n  --hero-glow:    0 12px 30px rgba(224,25,138,.28), 0 0 0 2px rgba(240,96,176,.50);\n\n  /* ── Motion ──\n     Restrained, confident. Fades and small lifts; no springy bounce. */\n  --ease-standard: cubic-bezier(.2,.6,.2,1); /* @kind other */\n  --ease-out:      cubic-bezier(.16,1,.3,1); /* @kind other */\n  --dur-fast:   .15s; /* @kind other */\n  --dur-base:   .2s; /* @kind other */\n  --dur-slow:   .4s; /* @kind other */\n\n  /* hover/press conventions:\n     - hover: lift (translateY -1px) + slightly stronger shadow, OR brightness 1.05\n     - press: scale .98, shadow collapses\n     - gradient buttons darken via brightness(.95) on press */\n}\n\n/* Brand keyframes — typing indicator dots in the conversation UI */\n@keyframes lybi-blink {\n  0%, 100% { opacity: .25; transform: translateY(0); }\n  50%      { opacity: 1;   transform: translateY(-3px); }\n}\n\n<\u002Fstyle>\n  <script src=\"da8a63ae-0525-450e-86e1-28f4d25ef808\"><\u002Fscript>\n  <style>\n    *, *::before, *::after { box-sizing:border-box; }\n    body { margin:0; background:#0A0420; font-family:'Assistant',system-ui,sans-serif; }\n    a { color:#E0198A; text-decoration:none; }\n    a:hover { color:#9A2295; }\n    ul { margin:0; padding-inline-start:17px; }\n    li { margin-bottom:5px; }\n    h1,h2,h3,p { margin:0; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div dir=\"rtl\" ref=\"{{ rootRef }}\" style=\"height:100vh;display:flex;flex-direction:column;background:#0A0420;overflow:hidden\">\n\n  <div style=\"height:78px;flex-shrink:0;display:flex;align-items:center;gap:18px;padding:0 22px;background:#0A0420;border-bottom:1px solid rgba(255,255,255,.14);position:relative;z-index:6\">\n    <img src=\"85e30dba-a5fb-4cc2-b4e0-06fdbfb239b5\" alt=\"Lybi.ai\" style=\"{{ logoStyle }}\">\n    <div style=\"flex:1;display:flex;align-items:stretch;justify-content:space-between;gap:2px;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none\">\n      <sc-for list=\"{{ chapters }}\" as=\"ch\" hint-placeholder-count=\"8\">\n        <div sc-camel-on-click=\"{{ ch.go }}\" style=\"{{ ch.btnStyle }}\" title=\"{{ ch.label }}\">\n          <span style=\"{{ ch.labelStyle }}\">{{ ch.label }}<\u002Fspan>\n          <div style=\"display:flex;gap:3px;justify-content:flex-start\">\n            <sc-for list=\"{{ ch.ticks }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <span sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\"><\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div dir=\"ltr\" style=\"{{ posStyle }}\">{{ pos }}<\u002Fdiv>\n    <div style=\"{{ arrowsStyle }}\">\n      <div sc-camel-on-click=\"{{ prev }}\" style=\"width:34px;height:34px;border-radius:100px;border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;cursor:pointer;user-select:none\" style-hover=\"background:rgba(255,255,255,.10)\">›<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ next }}\" style=\"width:34px;height:34px;border-radius:100px;border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;cursor:pointer;user-select:none\" style-hover=\"background:rgba(255,255,255,.10)\">‹<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-shrink:0\">\n      <div sc-camel-on-click=\"{{ toggleMenu }}\" style=\"height:34px;padding:0 14px;border-radius:100px;background:linear-gradient(135deg,#E0198A,#9A2295,#5B1E8A);display:flex;align-items:center;white-space:nowrap;color:#fff;font-size:14px;font-weight:700;cursor:pointer;user-select:none;box-shadow:0 6px 18px rgba(224,25,138,.28)\">כל השקפים<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div ref=\"{{ scrollerRef }}\" style=\"flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none;display:flex;flex-direction:column\">\n\n    <div style=\"height:100%;flex-shrink:0;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;overflow:hidden\">\n      <section data-screen-label=\"01 Cover\" style=\"width:1280px;height:720px;flex-shrink:0;position:relative;overflow:hidden;border-radius:8px;background:#0A0420;color:#fff;padding:70px 84px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 20px 60px rgba(0,0,0,.45);transform:scale(var(--s,1))\">\n        <div style=\"position:absolute;inset:0;background-image:radial-gradient(rgba(154,143,170,.10) 1px, transparent 1px);background-size:28px 28px;opacity:.5\"><\u002Fdiv>\n        <div style=\"position:absolute;top:-160px;right:-160px;width:520px;height:520px;background:radial-gradient(circle, rgba(91,30,138,.35), transparent 70%)\"><\u002Fdiv>\n        <div style=\"position:absolute;bottom:-180px;left:-120px;width:480px;height:480px;background:radial-gradient(circle, rgba(224,25,138,.20), transparent 70%)\"><\u002Fdiv>\n        <img src=\"b1789cf5-a4b8-4a6d-8af7-4a6efa41d192\" alt=\"\" style=\"position:absolute;top:50%;left:-40px;transform:translateY(-50%);width:400px;opacity:.14\">\n        <div style=\"position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between\">\n          <img src=\"85e30dba-a5fb-4cc2-b4e0-06fdbfb239b5\" alt=\"Lybi.ai\" style=\"height:28px\">\n          <span dir=\"ltr\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;color:rgba(255,255,255,.42)\">INTERNAL AGENT SYSTEM · 2026<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position:relative;z-index:2\">\n          <div dir=\"ltr\" style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;letter-spacing:4px;color:#F060B0;text-align:right;margin-bottom:20px\">SIX AGENTS · ONE SYSTEM<\u002Fdiv>\n          <h1 style=\"font-size:76px;font-weight:800;line-height:1.08;max-width:820px\">מערך הסוכנים<br><span style=\"background:linear-gradient(135deg,#E0198A,#9A2295,#5B1E8A);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent\">הפנימיים של Lybi<\u002Fspan><\u002Fh1>\n          <p style=\"font-size:24px;line-height:1.6;color:rgba(255,255,255,.62);margin-top:24px;max-width:700px;text-wrap:pretty\">סוכנים ייעודיים שמרחיבים את יכולת הצוות לחקור, לבנות, להמחיש, למכור ולשווק את Lybi<\u002Fp>\n        <\u002Fdiv>\n        <div dir=\"ltr\" style=\"position:relative;z-index:2;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;color:rgba(255,255,255,.35)\">\n          <span>lybi.ai<\u002Fspan><span>01 / 31<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n\n    <div style=\"height:100%;flex-shrink:0;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;overflow:hidden\">\n      <section data-screen-label=\"02 Why\" style=\"width:1280px;height:720px;flex-shrink:0;position:relative;overflow:hidden;border-radius:8px;background:radial-gradient(120% 70% at 50% -10%, #FBF5FF 0%, #FFFFFF 55%);color:#1A0A38;padding:52px 72px 40px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.45);transform:scale(var(--s,1))\">\n        <div style=\"flex-shrink:0\">\n          <div dir=\"ltr\" style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;letter-spacing:2.5px;color:#5B1E8A;text-align:right\">02 / WHY AN INTERNAL AGENT SYSTEM<\u002Fdiv>\n          <h1 style=\"font-size:44px;font-weight:800;line-height:1.12;margin-top:8px\">הפעילות של Lybi משלבת סוגי עבודה שונים מהותית זה מזה<\u002Fh1>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:22px\">\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px\">\n            <div style=\"border:2px solid #B49ED6;border-radius:100px;padding:9px 20px;font-size:19px;font-weight:600\">מחקר והבנת Use Cases<\u002Fdiv>\n            <div style=\"border:2px solid #B49ED6;border-radius:100px;padding:9px 20px;font-size:19px;font-weight:600\">בניית Agents על הפלטפורמה<\u002Fdiv>\n            <div style=\"border:2px solid #B49ED6;border-radius:100px;padding:9px 20px;font-size:19px;font-weight:600\">דמואים ומוקאפים אינטראקטיביים<\u002Fdiv>\n            <div style=\"border:2px solid #B49ED6;border-radius:100px;padding:9px 20px;font-size:19px;font-weight:600\">ניהול הזדמנויות ומכירה<\u002Fdiv>\n            <div style=\"border:2px solid #B49ED6;border-radius:100px;padding:9px 20px;font-size:19px;font-weight:600\">תוכן, אתר ונכסי שיווק<\u002Fdiv>\n            <div style=\"border:2px solid #B49ED6;border-radius:100px;padding:9px 20px;font-size:19px;font-weight:600\">ניהול ידע, גרסאות ועקביות<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:26px;font-weight:700;line-height:1.4;text-wrap:pretty\">סוכן אחד שיושב על כל הידע ומבצע את כל המשימות יהיה פחות מדויק ופחות מקצועי. לכן המודל מבוסס על שלושה עקרונות:<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px\">\n            <div style=\"border:2px solid #B49ED6;border-radius:14px;padding:18px 22px;background:#fff;box-shadow:0 6px 16px rgba(26,10,56,.10)\">\n              <h3 style=\"font-size:22px;font-weight:700;margin-bottom:6px\">התמחות לפי אחריות<\u002Fh3>\n              <p style=\"font-size:20px;line-height:1.45\">לכל סוכן מטרה, מתודולוגיה ובסיס ידע משלו.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"border:2px solid #B49ED6;border-radius:14px;padding:18px 22px;background:#fff;box-shadow:0 6px 16px rgba(26,10,56,.10)\">\n              <h3 style=\"font-size:22px;font-weight:700;margin-bottom:6px\">עבודה ב־Context מוגדר<\u002Fh3>\n              <p style=\"font-size:20px;line-height:1.45\">כל סוכן מקבל את הידע הרלוונטי למשימה, ללקוח ולפרויקט בלבד.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"border:2px solid #B49ED6;border-radius:14px;padding:18px 22px;background:#fff;box-shadow:0 6px 16px rgba(26,10,56,.10)\">\n              <h3 style=\"font-size:22px;font-weight:700;margin-bottom:6px\">חיבור בין הסוכנים<\u002Fh3>\n              <p style=\"font-size:20px;line-height:1.45\">התוצר של סוכן אחד הופך לקלט של הסוכן הבא.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div dir=\"ltr\" style=\"flex-shrink:0;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:2px;color:#665A7D\"><span>02 / 31<\u002Fspan><span>OPENING<\u002Fspan><\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n\n    <div style=\"height:100%;flex-shrink:0;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;overflow:hidden\">\n      <section data-screen-label=\"03 The six agents\" style=\"width:1280px;height:720px;flex-shrink:0;position:relative;overflow:hidden;border-radius:8px;background:radial-gradient(120% 70% at 50% -10%, #FBF5FF 0%, #FFFFFF 55%);color:#1A0A38;padding:52px 72px 40px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.45);transform:scale(var(--s,1))\">\n        <div style=\"flex-shrink:0\">\n          <div dir=\"ltr\" style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;letter-spacing:2.5px;color:#5B1E8A;text-align:right\">03 / THE SYSTEM · CLICK ANY AGENT<\u002Fdiv>\n          <h1 style=\"font-size:44px;font-weight:800;line-height:1.12;margin-top:8px\">מערך הסוכנים<\u002Fh1>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:20px;padding:24px 0\">\n          <div sc-camel-on-click=\"{{ goA1 }}\" style=\"border:2px solid #B49ED6;border-radius:14px;padding:20px 22px;backgroun rt: 'Growth', start: 19, count: 4 },\n  { label: 'Knowledge Keeper', short: 'Keeper', start: 23, count: 4 },\n  { label: 'מודל משותף', short: 'מודל', start: 27, count: 4 },\n];\nconst TITLES = [\n  'שער', 'למה מערך סוכנים', 'מערך הסוכנים',\n  'מטרת הסוכן', 'התוצרים המרכזיים', 'בסיס התוכן', 'מבנה הסוכן',\n  'מטרת הסוכן', 'התוצרים המרכזיים', 'בסיס התוכן', 'מבנה הסוכן',\n  'מטרת הסוכן', 'התוצרים המרכזיים', 'בסיס התוכן', 'מבנה הסוכן',\n  'מטרת הסוכן', 'התוצרים המרכזיים', 'בסיס התוכן', 'מבנה הסוכן',\n  'מטרת הסוכן', 'התוצרים המרכזיים', 'בסיס התוכן', 'מבנה הסוכן',\n  'מטרת הסוכן', 'התוצרים המרכזיים', 'בסיס התוכן', 'מבנה הסוכן',\n  'שכבות ידע משותפות', 'מודל העבודה', 'זרימת העבודה', 'סיכום',\n];\nconst KEY = 'lybi-agents-deck-slide';\n\nclass Component extends DCLogic {\n  state = { i: 0, menuOpen: false, narrow: false };\n\n  constructor(props) {\n    super(props);\n    this.rootRef = React.createRef();\n    this.scrollerRef = React.createRef();\n  }\n\n  componentDidMount() {\n    this.fit();\n    this._onResize = () => this.fit();\n    window.addEventListener('resize', this._onResize);\n    this._onKey = (e) => {\n      if (e.key === 'Escape') { this.setState({ menuOpen: false }); return; }\n      if (e.key === 'm' || e.key === 'M') { this.setState((s) => ({ menuOpen: !s.menuOpen })); return; }\n      if (e.key === 'ArrowLeft' || e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); this.step(1); }\n      else if (e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); this.step(-1); }\n      else if (e.key === 'Home') this.goTo(0);\n      else if (e.key === 'End') this.goTo(TITLES.length - 1);\n    };\n    window.addEventListener('keydown', this._onKey);\n    const el = this.scrollerRef.current;\n    if (el) {\n      this._onScroll = () => {\n        const h = el.clientHeight || 1;\n        const i = Math.max(0, Math.min(TITLES.length - 1, Math.round(el.scrollTop / h)));\n        if (i !== this.state.i) {\n          this.setState({ i });\n          try { localStorage.setItem(KEY, String(i)); } catch (err) {}\n        }\n      };\n      el.addEventListener('scroll', this._onScroll, { passive: true });\n      let saved = 0;\n      try { saved = parseInt(localStorage.getItem(KEY) || '0', 10) || 0; } catch (err) {}\n      if (saved > 0) setTimeout(() => this.goTo(saved, 'auto'), 60);\n    }\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._onResize);\n    window.removeEventListener('keydown', this._onKey);\n    const el = this.scrollerRef.current;\n    if (el && this._onScroll) el.removeEventListener('scroll', this._onScroll);\n  }\n\n  fit() {\n    const el = this.scrollerRef.current, root = this.rootRef.current;\n    if (!el || !root) return;\n    const s = Math.min((el.clientWidth - 48) / 1280, (el.clientHeight - 32) / 720);\n    root.style.setProperty('--s', String(Math.max(0.2, s)));\n    const narrow = root.clientWidth < 1180;\n    if (narrow !== this.state.narrow) this.setState({ narrow });\n  }\n\n  goTo(i, behavior) {\n    const el = this.scrollerRef.current;\n    if (!el) return;\n    const n = Math.max(0, Math.min(TITLES.length - 1, i));\n    el.scrollTo({ top: n * el.clientHeight, behavior: behavior || 'smooth' });\n    this.setState({ i: n, menuOpen: false });\n  }\n\n  step(d) { this.goTo(this.state.i + d); }\n\n  renderVals() {\n    const i = this.state.i;\n    const showTicks = this.props.showTicks ?? true;\n    const chapters = CH.map((c) => {\n      const active = i >= c.start && i < c.start + c.count;\n      return {\n        label: this.state.narrow ? c.short : c.label,\n        go: () => this.goTo(c.start),\n        btnStyle: {\n          flex: '0 1 auto', display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: '6px',\n          padding: '7px 9px', borderRadius: '10px', cursor: 'pointer', userSelect: 'none',\n          background: active ? 'rgba(255,255,255,.10)' : 'transparent',\n          border: active ? '1px solid rgba(255,255,255,.28)' : '1px solid transparent',\n          transition: 'background .15s ease',\n        },\n        labelStyle: {\n          fontSize: '13px', fontWeight: active ? 800 : 600, whiteSpace: 'nowrap',\n          color: active ? '#fff' : 'rgba(255,255,255,.58)',\n        },\n        ticks: showTicks ? Array.from({ length: c.count }, (_, k) => {\n          const idx = c.start + k;\n          return {\n            go: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.goTo(idx); },\n            style: {\n              height: '4px', borderRadius: '100px', cursor: 'pointer', flex: '1 0 12px', minWidth: '12px',\n              background: idx === i ? 'linear-gradient(135deg,#E0198A,#9A2295)'\n                : idx < i ? 'rgba(240,96,176,.45)' : 'rgba(255,255,255,.18)',\n            },\n          };\n        }) : [],\n      };\n    });\n    const menuChapters = CH.map((c) => ({\n      label: c.label,\n      items: Array.from({ length: c.count }, (_, k) => {\n        const idx = c.start + k;\n        return {\n          label: (idx + 1) + '. ' + TITLES[idx],\n          go: () => this.goTo(idx),\n          style: {\n            fontSize: '16px', padding: '5px 10px', borderRadius: '8px', cursor: 'pointer',\n            color: idx === i ? '#fff' : 'rgba(255,255,255,.72)',\n            background: idx === i ? 'linear-gradient(135deg,#E0198A,#9A2295,#5B1E8A)' : 'transparent',\n          },\n        };\n      }),\n    }));\n    const narrow = this.state.narrow;\n    return {\n      logoStyle: { height: '20px', opacity: .9, flexShrink: 0, display: narrow ? 'none' : 'block' },\n      posStyle: {\n        fontFamily: \"'JetBrains Mono',monospace\", fontSize: '13px', letterSpacing: '1.5px',\n        color: 'rgba(255,255,255,.55)', flexShrink: 0, minWidth: '62px', textAlign: 'center',\n        display: narrow ? 'none' : 'block',\n      },\n      arrowsStyle: { display: narrow ? 'none' : 'flex', gap: '6px', flexShrink: 0 },\n      rootRef: this.rootRef, scrollerRef: this.scrollerRef,\n      chapters, menuChapters,\n      menuOpen: this.state.menuOpen,\n      pos: (i + 1) + ' / ' + TITLES.length,\n      prev: () => this.step(-1),\n      next: () => this.step(1),\n      toggleMenu: () => this.setState((s) => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      goA1: () => this.goTo(3), goA2: () => this.goTo(7), goA3: () => this.goTo(11),\n      goA4: () => this.goTo(15), goA5: () => this.goTo(19), goA6: () => this.goTo(23),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
